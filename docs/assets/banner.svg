<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">govflow: Automated Integration &amp; Documentation Engine</title>
  <desc id="banner-desc">Collect, evaluate, plan, approve, apply and document, with a tamper-evident audit trail.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00f7ff" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="#0d1117"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect y="236" width="1200" height="4" fill="url(#fade)"/>
  <text x="60" y="76" fill="#00f7ff" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="22" letter-spacing="2">&gt;_ govflow</text>
  <text x="60" y="130" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700">Automated Integration &amp; Documentation Engine</text>
  <text x="60" y="178" fill="#8b949e" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="20">collect → evaluate → plan → approve → apply → document</text>
</svg>
