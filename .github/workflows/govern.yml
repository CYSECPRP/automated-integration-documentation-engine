name: Governance run

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      canary:
        description: Plan a canary change that exercises the approval gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: governance
  cancel-in-progress: false

jobs:
  scan:
    name: Scan, plan and document
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_id: ${{ steps.scan.outputs.run_id }}
      plan_digest: ${{ steps.scan.outputs.plan_digest }}
      executable_actions: ${{ steps.scan.outputs.executable_actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.13.6
      - name: Install govflow
        run: uv sync --locked --no-dev
      - name: Fetch the previous audit head
        id: previous
        run: |
          if git fetch --depth=1 origin evidence 2>/dev/null; then
            git show FETCH_HEAD:latest/audit.jsonl > "$RUNNER_TEMP/previous-audit.jsonl"
            echo "chain_from=$RUNNER_TEMP/previous-audit.jsonl" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan
        id: scan
        env:
          # Optional read-only token with Administration: read; empty falls back to GITHUB_TOKEN.
          GOVFLOW_GITHUB_TOKEN: ${{ secrets.GOVFLOW_SCAN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CHAIN_FROM: ${{ steps.previous.outputs.chain_from }}
          CANARY: ${{ inputs.canary && '--canary' || '' }}
        run: |
          uv run --no-sync govflow scan --config govflow.yaml --out runs --actor "github-actions[bot]" \
            ${CHAIN_FROM:+--chain-from "$CHAIN_FROM"} $CANARY
      - name: Build documentation
        env:
          RUN_DIR: runs/${{ steps.scan.outputs.run_id }}
        run: |
          uv run --no-sync govflow docs "$RUN_DIR" --site site --config govflow.yaml
          uv run --no-sync govflow demo --out "$RUNNER_TEMP/demo"
          cp -r "$RUNNER_TEMP/demo/site" site/demo
      - name: Upload run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-run
          path: runs/${{ steps.scan.outputs.run_id }}
          retention-days: 30
      - name: Upload report
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  record:
    name: Record evidence
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: governance-run
          path: ${{ runner.temp }}/run
      - name: Commit to the evidence branch
        env:
          RUN_ID: ${{ needs.scan.outputs.run_id }}
        run: bash scripts/publish-evidence.sh "$RUNNER_TEMP/run" "$RUN_ID"

  deploy:
    name: Publish report
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  remediate:
    name: Apply approved changes
    needs: [scan, record]
    if: needs.scan.outputs.executable_actions != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: remediation
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: pipx install uv==0.13.6
      - name: Install govflow
        run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: governance-run
          path: ${{ runner.temp }}/run
      - name: Record the environment approval against the plan digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DIGEST: ${{ needs.scan.outputs.plan_digest }}
        run: |
          approver=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved")][0].user.login // empty')
          if [ -z "$approver" ]; then
            echo "No environment approval was recorded for this run; refusing to apply." >&2
            exit 3
          fi
          uv run --no-sync govflow approve "$RUNNER_TEMP/run" --config govflow.yaml \
            --approver "$approver" --digest "$DIGEST" \
            --comment "Approved through the remediation environment in workflow run $RUN_ID"
      - name: Apply allowlisted changes as pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync govflow apply "$RUNNER_TEMP/run" --config govflow.yaml --execute \
            --actor "github-actions[bot]"
      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-run-remediation
          path: ${{ runner.temp }}/run
          retention-days: 30
      - name: Commit to the evidence branch
        env:
          RUN_ID: ${{ needs.scan.outputs.run_id }}
        run: bash scripts/publish-evidence.sh "$RUNNER_TEMP/run" "$RUN_ID"
