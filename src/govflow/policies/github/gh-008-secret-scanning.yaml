id: GH-008
title: Secret scanning and push protection are enabled
resource: github.repository
severity: high
rationale: >-
  Secret scanning detects leaked credentials, and push protection blocks them before they
  reach the repository, where they would remain in the history.
check:
  all:
    - path: security_and_analysis.secret_scanning
      op: eq
      value: enabled
    - path: security_and_analysis.secret_scanning_push_protection
      op: eq
      value: enabled
remediation:
  steps:
    - Open Settings > Advanced Security.
    - Enable Secret Protection, including push protection.
    - Rotate any credential that secret scanning has already reported.
references:
  - framework: GitHub Docs
    control: About secret scanning
tags: [secrets]
