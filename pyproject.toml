[project]
name = "govflow"
version = "0.1.0"
description = "Automated Integration & Documentation Engine: governed IT automation with policy-as-code, approval gates, a tamper-evident audit trail and generated compliance documentation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prajwal R Pattanshetti" }]
keywords = ["governance", "compliance", "policy-as-code", "automation", "devsecops", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1.4",
    "pydantic>=2.8",
    "pyyaml>=6.0.2",
    "rich>=13.7",
    "typer>=0.12.5",
]

[project.urls]
Homepage = "https://cysecprp.github.io/automated-integration-documentation-engine/"
Source = "https://github.com/CYSECPRP/automated-integration-documentation-engine"

[project.scripts]
govflow = "govflow.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "C4", "PTH", "RET", "N", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pathlib.Path", "typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=govflow --cov-report=term-missing --strict-markers"

[tool.coverage.run]
branch = true
source = ["govflow"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
